<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pemindai Tiket</title>
<style>
:root{--bg:#13100e;--panel:#1b1714;--line:#2e2822;--ink:#efe6d6;--muted:#a09482;--brass:#c9a26a;--ok:#2f7d4f;--warn:#b3741c;--bad:#a8362e}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin-inline:auto}
h1{font:600 24px/1.2 Georgia,serif;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
label{display:block;font-size:13.5px;color:var(--muted);margin:0 0 6px}
input{width:100%;background:#13100e;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.row{display:flex;gap:8px}
button{border:0;border-radius:10px;background:var(--brass);color:#1a140c;font:600 15px system-ui,sans-serif;padding:12px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1/1;margin:0 0 14px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.stat{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px;color:var(--muted)}
.stat b{font:600 28px Georgia,serif;color:var(--ink)}
.res{border-radius:14px;padding:18px 16px;text-align:center;margin:0 0 14px;color:#fff;background:#3a322b}
.res.ok{background:var(--ok)}.res.warn{background:var(--warn)}.res.bad{background:var(--bad)}
.res .big{font:700 30px/1.1 system-ui,sans-serif;letter-spacing:.03em}
.res .who{font:600 22px/1.3 Georgia,serif;margin-top:6px}
.res .det{opacity:.92;font-size:15px}
.err{color:#e0a9a9;font-size:14px;margin:8px 0 0}
</style>
</head>
<body>
<h1>Pemindai tiket</h1>
<p class="sub" id="evt">Halaman untuk petugas pintu masuk</p>

<div class="card" id="pinCard">
  <label for="pin">PIN petugas</label>
  <div class="row"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN dari panitia"><button id="start" type="button">Mulai</button></div>
  <p class="err" id="pinErr" hidden></p>
</div>

<div id="scanArea" hidden>
  <div class="stat"><span>Sudah masuk</span><b id="count">0 / 0</b></div>
  <div class="cam"><video id="video" playsinline muted></video><div class="frame"></div></div>
  <div class="res" id="res"><div class="big">Arahkan kamera ke QR</div><div class="det">Hasil pemindaian muncul di sini</div></div>
  <div class="card">
    <label for="manual">Kalau QR tidak terbaca, ketik ID pesanan dan kursi (contoh: OED-AB12C A1)</label>
    <div class="row"><input id="manual" autocapitalize="characters" autocomplete="off" placeholder="OED-XXXXX A1"><button class="ghost" id="manualGo" type="button">Cek</button></div>
  </div>
  <button class="ghost" id="stop" type="button" style="width:100%">Berhenti</button>
</div>

<script src="config.js"></script>
<script src="jsqr.js"></script>
<script>
(function () {
  var API = String(window.TIKET_API || '').trim();
  var $ = function (s) { return document.querySelector(s); };
  var stream = null, timer = null, busy = false, last = { text: '', at: 0 }, detector = null, pin = '';
  var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  var audio = null;

  function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } return null; }

  function call(code) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'checkIn', args: [pin, code] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.__error) throw new Error(j.__error); return j; });
  }

  function beep(kind) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = kind === 'ok' ? 880 : 220; o.type = 'sine';
      g.gain.value = 0.15; o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + (kind === 'ok' ? 0.12 : 0.35));
    } catch (e) { return; }
    try { if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 60 : [120, 60, 120]); } catch (e2) { return; }
  }

  function clock(ms) {
    try { return new Date(ms).toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit' }); } catch (e) { return ''; }
  }
  var TIER = { vip: 'VIP', premium: 'Premium', reguler: 'Reguler', ekonomi: 'Ekonomi' };

  function show(cls, big, who, det) {
    var el = $('#res');
    el.className = 'res ' + cls;
    el.innerHTML = '';
    var a = document.createElement('div'); a.className = 'big'; a.textContent = big; el.appendChild(a);
    if (who) { var b = document.createElement('div'); b.className = 'who'; b.textContent = who; el.appendChild(b); }
    if (det) { var c = document.createElement('div'); c.className = 'det'; c.textContent = det; el.appendChild(c); }
  }

  function render(r) {
    if (!r || r.ok === false) { beep('bad'); show('bad', 'GAGAL', '', (r && r.message) || 'Tidak bisa menghubungi server.'); return; }
    if (r.total !== undefined) $('#count').textContent = r.hadir + ' / ' + r.total;
    var seat = r.seat ? 'Kursi ' + r.seat + (r.tier && TIER[r.tier] ? ' · ' + TIER[r.tier] : '') : '';
    if (r.result === 'OK') { beep('ok'); show('ok', 'SILAKAN MASUK', r.name, seat + ' · ' + clock(r.at)); }
    else if (r.result === 'SUDAH') { beep('bad'); show('warn', 'SUDAH DIPAKAI', r.name, seat + ' · masuk pukul ' + clock(r.at)); }
    else if (r.result === 'BELUM_LUNAS') { beep('bad'); show('warn', 'BELUM LUNAS', r.name, seat + ' · ' + (r.message || '')); }
    else { beep('bad'); show('bad', 'TIKET TIDAK VALID', '', r.message || ''); }
  }

  function submit(code) {
    if (busy) return;
    busy = true;
    show('', 'Memeriksa...', '', code);
    call(code).then(render).catch(function (e) { render({ ok: false, message: 'Koneksi bermasalah: ' + (e && e.message ? e.message : e) }); }).then(function () { busy = false; });
  }

  function onText(text) {
    var now = Date.now();
    if (!text || (text === last.text && now - last.at < 4000)) return;
    last = { text: text, at: now };
    submit(text);
  }

  function tick() {
    var v = $('#video');
    if (!stream || v.readyState < 2) return;
    if (detector) {
      detector.detect(v).then(function (codes) { if (codes && codes[0]) onText(codes[0].rawValue); }).catch(function () { return; });
      return;
    }
    var w = v.videoWidth, h = v.videoHeight;
    if (!w || !h) return;
    var scale = Math.min(1, 640 / Math.max(w, h));
    canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var res = window.jsQR ? window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' }) : null;
    if (res && res.data) onText(res.data);
  }

  function stop() {
    clearInterval(timer); timer = null;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
    $('#scanArea').hidden = true; $('#pinCard').hidden = false;
  }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { show('bad', 'Kamera tidak tersedia', '', 'Buka halaman ini lewat https di Safari atau Chrome. Kamu masih bisa mengetik manual.'); return Promise.resolve(); }
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (s) {
      stream = s;
      var v = $('#video'); v.srcObject = s; return v.play();
    }).then(function () {
      try { detector = window.BarcodeDetector ? new window.BarcodeDetector({ formats: ['qr_code'] }) : null; } catch (e) { detector = null; }
      timer = setInterval(tick, 180);
    }).catch(function (e) {
      show('bad', 'Kamera tidak bisa dibuka', '', 'Izinkan akses kamera untuk situs ini, atau ketik manual di bawah. (' + (e && e.name ? e.name : '') + ')');
    });
  }

  $('#start').addEventListener('click', function () {
    var err = $('#pinErr'); err.hidden = true;
    pin = $('#pin').value.trim();
    if (!API) { err.textContent = 'Alamat server belum diisi di config.js.'; err.hidden = false; return; }
    if (pin.length < 4) { err.textContent = 'Masukkan PIN dari panitia.'; err.hidden = false; return; }
    var btn = $('#start'); btn.disabled = true;
    call('cek.PIN').then(function (r) {
      btn.disabled = false;
      if (r && r.ok === false) { err.textContent = r.message || 'PIN ditolak.'; err.hidden = false; return; }
      store('pin', pin);
      $('#pinCard').hidden = true; $('#scanArea').hidden = false;
      show('', 'Arahkan kamera ke QR', '', 'Hasil pemindaian muncul di sini');
      startCamera();
    }).catch(function (e) { btn.disabled = false; err.textContent = 'Koneksi bermasalah: ' + (e && e.message ? e.message : e); err.hidden = false; });
  });
  $('#stop').addEventListener('click', stop);
  $('#manualGo').addEventListener('click', function () {
    var t = $('#manual').value.trim().toUpperCase().split(' ').filter(Boolean).join('.');
    if (t) { submit(t); $('#manual').value = ''; }
  });
  $('#manual').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#manualGo').click(); });
  var saved = store('pin'); if (saved) $('#pin').value = saved;
})();
</script>
</body>
</html>
