:root:not([data-theme="light"]) header .art{filter:brightness(.72) contrast(1.05)}
@media (prefers-color-scheme: light){:root[data-theme="system"] header .art{filter:none}}
@media(max-width:700px){header .art{width:100%;opacity:.28;-webkit-mask-image:none;mask-image:none}}
header{padding:36px 0 22px;border-bottom:1px solid var(--line)}
.kicker{letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--brass)}
h1{font:600 clamp(42px,7vw,70px)/1 "Cormorant Garamond",Georgia,serif;margin:6px 0 12px;letter-spacing:.02em}
.meta{color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px}
.layout{display:grid;gap:24px;padding:24px 0 110px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 340px;padding-bottom:48px;align-items:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.pill{border:1px solid var(--brass);color:var(--brass);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:500}
select{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.zoom{display:flex;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);font-size:18px;cursor:pointer}
.zoom button:hover{border-color:var(--brass)}
.mapscroll{overflow:auto;padding:10px 12px 6px}
svg#map{display:block;width:100%;min-width:720px;height:auto}
svg#map.loading{opacity:.4;pointer-events:none}
.stage{fill:var(--stagefill);stroke:var(--stagestroke)}
.stg{font:600 19px "Cormorant Garamond",Georgia,serif;letter-spacing:.32em;fill:var(--brass);text-anchor:middle}
.sub{font:400 11px "DM Sans",sans-serif;fill:var(--faint);text-anchor:middle}
.apron{fill:none;stroke:var(--hair);stroke-dasharray:4 4}
.rl{font:600 12px "DM Sans",sans-serif;fill:var(--faint);text-anchor:middle}
.sec{font:500 12px "DM Sans",sans-serif;fill:var(--muted);text-anchor:middle;letter-spacing:.04em}
.stairs{stroke:var(--hair);stroke-width:1.4}
.t-premium{--c:#c9a26a}.t-reguler{--c:#86a594}.t-ekonomi{--c:#7b93b5}.t-vip{--c:#3a3028}
.seat{cursor:pointer;outline:none}
.seat rect{fill:var(--c);stroke:rgba(0,0,0,.25);stroke-width:1;transition:fill .12s}
.seat text{font:600 11px "DM Sans",sans-serif;fill:#17120e;text-anchor:middle;pointer-events:none}
.seat .x{display:none;stroke:var(--xmark);stroke-width:1.6;fill:none;pointer-events:none}
.seat.free:hover rect,.seat.invite:hover rect{filter:brightness(1.18)}
.seat:focus-visible rect{stroke:var(--ink);stroke-width:2.5}
.seat.sold,.seat.blocked,.seat.held,.seat.quota{cursor:not-allowed}
.seat.sold rect{fill:var(--sold-bg);stroke:var(--hair)}
.seat.sold text{display:none}
.seat.sold .x{display:block}

const between = (m, a, b) => (m.indexOf(a) === 0 && m.length >= a.length + b.length && m.slice(m.length - b.length) === b) ? m.slice(a.length, m.length - b.length) : null;
function trSrv(msg) {
  const m = String(msg || '');
  if (lang !== 'en' || !m) return m;
  if (SRV_EN[m]) return SRV_EN[m];
  let x = between(m, 'Maksimal ', ' kursi per pemesanan.');
  if (x !== null) return T('Maksimal {n} kursi per pemesanan.', { n: x });
  x = between(m, 'Kursi ', ' baru saja diambil orang lain.');
  if (x !== null) return 'Seat(s) ' + x + ' were just taken by someone else.';
  x = between(m, 'Kursi ', ' tidak termasuk kursi undangan.');
  if (x !== null) return 'Seat(s) ' + x + ' are not invitation seats.';
  x = between(m, 'Kode ini hanya cukup untuk ', ' kursi undangan.');
  if (x !== null) return 'This code covers only ' + x + ' invitation seats.';
  x = between(m, 'Kuota tiket ', ' kursi.');

  x = between(m, 'Kuota undangan ', ' kursi.');
  if (x !== null) { const p = x.split(' tinggal '); if (p.length === 2) return 'Invitation quota for ' + T(p[0]) + ' is down to ' + p[1] + ' seat(s).'; }
  x = between(m, 'Kode ini tidak berlaku untuk kursi ', '.');

}

function demoStatus() {
  let a = 0x9e3779b9;
  const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const sold = [], held = [];
  SEATS.filter(s => !isBlocked(s)).forEach(s => { const r = rnd(); if (r < 0.3) sold.push(s.id); else if (r < 0.33) held.push(s.id); });
  return { sold, held };
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- logika kursi ---------- */
const isBlocked = s => !CONFIG.tiers[s.tier].prices || status.blocked.has(s.id) || status.blocked.has(s.row);
const isInvitable = s => isBlocked(s) && !(status.noInvite.has(s.id) || status.noInvite.has(s.row));
const inviteTier = t => (invite && invite.tiers && invite.tiers[t]) || null;
const inviteLeft = t => { const g = inviteTier(t); return g ? g.left : 0; };
const quotaLeft = t => { const v = status.quota[t]; return v === null || v === undefined ? Infinity : v; };
function isInviteSeat(s) {
  const g = inviteTier(s.tier);
  if (!g) return false;
  return g.kind === 'BEBAS' ? !isBlocked(s) : isInvitable(s);
}
function statusOf(s) {
  if (status.sold.has(s.id)) return 'sold';
  if (status.held.has(s.id)) return 'held';
  if (invite && isInviteSeat(s) && inviteLeft(s.tier) > 0) return 'invite';
  if (isBlocked(s)) return 'blocked';
  if (quotaLeft(s.tier) <= 0) return 'quota';
  return 'free';
}
const isInvSel = s => isBlocked(s) || (!!invite && isInviteSeat(s));
const tierPrices = t => { const x = CONFIG.tiers[t]; return x && x.prices ? x.prices : EMPTY; };
const tierPrice = t => tierPrices(t)[phase] || 0;
const tierLabel = t => { const x = CONFIG.tiers[t]; return x && x.label ? T(x.label) : ''; };
const taxOf = sub => Math.round(sub * (CONFIG.taxPct || 0) / 100);
const taxNote = () => CONFIG.taxPct ? T('Harga belum termasuk pajak {pct}%. Pajak ditambahkan saat checkout.', { pct: CONFIG.taxPct }) : '';
const priceOf = s => isInvSel(s) ? 0 : tierPrice(s.tier);
const selectable = st => st === 'free' || st === 'invite';
const STATUS_TEXT = { get sold() { return T('sudah terjual'); }, get held() { return T('sedang ditahan'); }, get blocked() { return T('khusus undangan'); }, get invite() { return T('kursi undangan'); }, get quota() { return T('kuota fase ini habis'); } };
const selectedSeats = () => [...selected].map(id => byId.get(id)).sort((a, b) => a.row.localeCompare(b.row) || a.num - b.num);
const inviteCount = () => [...selected].filter(id => isInvSel(byId.get(id))).length;
const selCountTier = (t, inv) => [...selected].filter(id => { const s = byId.get(id); return s.tier === t && isInvSel(s) === inv; }).length;

  const st = statusOf(s);
  if (st === 'blocked') { toast(invite ? T('Kursi {id} tidak termasuk kursi undangan.', { id }) : T('Kursi {id} khusus undangan. Masukkan kode undangan di panel pesanan.', { id })); return; }

/* ---------- bukti bayar: kecilkan gambar sebelum dikirim ---------- */
function fileToJpeg(file) {
  return new Promise((ok, fail) => {
    if (String(file.type || '').indexOf('image' + '/') !== 0) return fail(new Error(T('File harus berupa gambar (JPG atau PNG).')));
    const fr = new FileReader();
    fr.onerror = () => fail(new Error(T('File tidak bisa dibaca.')));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => fail(new Error(T('Gambar tidak bisa dibuka. Coba tangkapan layar (screenshot) buktinya.')));
      img.onload = () => {
        const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.82);
        ok({ b64: url.split(',')[1], preview: url });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  if (dlg.open) {
    if (saved) { openCheckout(); $('#fName').value = saved.n; $('#fWa').value = saved.w; $('#fEmail').value = saved.e; }
    else if (lastOrder) routeOrder(lastOrder);
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('#segTheme button, #segLang button');
  if (!b) return;
  if (b.dataset.theme) applyTheme(b.dataset.theme); else if (b.dataset.lang) applyLang(b.dataset.lang);
});

/* ---------- mulai ---------- */
(function init() {
  const sl = store.get('lang'); lang = sl === 'en' ? 'en' : 'id';
  applyTheme(store.get('theme'));
  applyEvent(CONFIG.event);
  applyStatic();
  const sel = $('#phaseSel');
  sel.innerHTML = Object.entries(CONFIG.phases).map(([k, v]) => `<option value="${k}">${T(v)}</option>`).join('');
  if (DEMO) { sel.hidden = false; $('#demo').hidden = false; }
  sel.addEventListener('change', () => { phase = sel.value; renderAll(); });
  $('#go').addEventListener('click', openCheckout);
  drawMap();
  renderAll();
  loadStatus();
  if (!DEMO) setInterval(loadStatus, CONFIG.pollSeconds * 1000);
  const fromParams = p => { if (p && p.o && p.t) openOrder(String(p.o), String(p.t)); };
  if (GAS && google.script.url && google.script.url.getLocation) google.script.url.getLocation(loc => fromParams(loc && loc.parameter));
  else if (!GAS) { const q = new URLSearchParams(location.search); fromParams({ o: q.get('o'), t: q.get('t') }); }
})();
</script>
